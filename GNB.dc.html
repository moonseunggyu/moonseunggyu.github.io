<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="ds/tokens.css">
<link rel="stylesheet" href="ds/bundle.css">
<script src="ds/bundle.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; }
a { color: #1A47D1; }
a:hover { color: #1438A6; }
</style>
</helmet>
<div aria-hidden="true" style="height:73px"></div>
<header onMouseLeave="{{ closeMega }}" style="position:fixed;top:calc(var(--gnb-offset, 73px) - 73px);left:0;right:0;transition:top .25s ease;z-index:50;background:#FFFFFF;border-bottom:1px solid #E3E7ED;font-family:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#2A2A2A">
  <sc-if value="{{ megaOpen }}" hint-placeholder-val="{{ false }}">
    <div aria-hidden="true" style="position:absolute;left:0;right:0;top:72px;height:{{ megaH }};z-index:1;background:#FFFFFF;border-top:1px solid #E3E7ED;border-bottom:1px solid #E3E7ED;box-shadow:0 6px 16px rgba(16,24,40,0.10)">
      <div style="max-width:1348px;margin:0 auto;padding:28px 24px 0">
        <span style="display:block;width:160px;font-size:20px;line-height:30px;font-weight:700">{{ hoverLabel }}</span>
      </div>
    </div>
  </sc-if>
  <div style="position:relative;z-index:2;max-width:1348px;margin:0 auto;padding:0 24px;height:72px;display:flex;align-items:center;gap:32px">
    <a href="메인.dc.html" aria-label="미코스쿨 상상이상 메인" style="display:flex;align-items:center;width:160px;flex-shrink:0"><img src="assets/logo.png" alt="MiCo School 상상이상" style="height:40px;width:auto;display:block"></a>
    <nav aria-label="주 메뉴" style="flex:1 1 760px;max-width:800px;min-width:0;display:grid;grid-template-columns:repeat(5,minmax(max-content,1fr));column-gap:8px;height:72px">
      <sc-for list="{{ menus }}" as="m" hint-placeholder-count="4">
        <div onMouseEnter="{{ m.onEnter }}" style="position:relative;min-width:0">
          <sc-if value="{{ m.on }}" hint-placeholder-val="{{ false }}">
            <a href="{{ m.href }}" onFocus="{{ m.onEnter }}" onClick="{{ m.onClick }}" style="display:flex;align-items:center;justify-content:center;height:72px;padding:0 8px;font-size:16px;font-weight:700;color:#1C59FE;text-decoration:none;border-bottom:2px solid #1C59FE;white-space:nowrap">{{ m.label }}</a>
          </sc-if>
          <sc-if value="{{ m.off }}" hint-placeholder-val="{{ true }}">
            <a href="{{ m.href }}" onFocus="{{ m.onEnter }}" onClick="{{ m.onClick }}" style="display:flex;align-items:center;justify-content:center;height:72px;padding:0 8px;font-size:16px;font-weight:600;color:#4A5260;text-decoration:none;border-bottom:2px solid transparent;white-space:nowrap">{{ m.label }}</a>
          </sc-if>
          <sc-if value="{{ m.showHot }}" hint-placeholder-val="{{ false }}">
            <ul style="position:absolute;top:73px;left:0;right:0;height:{{ colH }};box-sizing:border-box;list-style:none;margin:0;padding:20px 0 32px;display:flex;flex-direction:column;gap:2px;background:#F8F9FB">
              <sc-for list="{{ m.subs }}" as="s" hint-placeholder-count="3">
                <sc-if value="{{ s.live }}" hint-placeholder-val="{{ true }}">
                <li><a href="{{ s.href }}" onClick="{{ s.onClick }}" style="display:flex;align-items:center;justify-content:center;height:36px;padding:0 8px;font-size:14px;font-weight:600;color:#2A2A2A;text-decoration:none;white-space:nowrap" style-hover="color:#1C59FE">{{ s.label }}</a></li>
                </sc-if>
                <sc-if value="{{ s.soon }}" hint-placeholder-val="{{ false }}">
                <li><a href="#" aria-disabled="true" onClick="{{ s.onClick }}" style="display:flex;align-items:center;justify-content:center;height:36px;padding:0 8px;font-size:14px;font-weight:500;color:#8A919C;text-decoration:none;white-space:nowrap;cursor:pointer">{{ s.label }}</a></li>
                </sc-if>
              </sc-for>
            </ul>
          </sc-if>
          <sc-if value="{{ m.showCold }}" hint-placeholder-val="{{ false }}">
            <ul style="position:absolute;top:73px;left:0;right:0;height:{{ colH }};box-sizing:border-box;list-style:none;margin:0;padding:20px 0 32px;display:flex;flex-direction:column;gap:2px">
              <sc-for list="{{ m.subs }}" as="s" hint-placeholder-count="3">
                <sc-if value="{{ s.live }}" hint-placeholder-val="{{ true }}">
                <li><a href="{{ s.href }}" onClick="{{ s.onClick }}" style="display:flex;align-items:center;justify-content:center;height:36px;padding:0 8px;font-size:14px;font-weight:500;color:#4A5260;text-decoration:none;white-space:nowrap" style-hover="color:#1C59FE">{{ s.label }}</a></li>
                </sc-if>
                <sc-if value="{{ s.soon }}" hint-placeholder-val="{{ false }}">
                <li><a href="#" aria-disabled="true" onClick="{{ s.onClick }}" style="display:flex;align-items:center;justify-content:center;height:36px;padding:0 8px;font-size:14px;font-weight:500;color:#8A919C;text-decoration:none;white-space:nowrap;cursor:pointer">{{ s.label }}</a></li>
                </sc-if>
              </sc-for>
            </ul>
          </sc-if>
        </div>
      </sc-for>
    </nav>
    <div style="margin-left:auto;flex-shrink:0;display:flex;align-items:center;gap:12px">
      <sc-if value="{{ loggedIn }}" hint-placeholder-val="{{ true }}">
        <div style="display:flex;align-items:center;gap:6px">
          <a href="나의 학습.dc.html#notes" aria-label="쪽지함 (안 읽은 쪽지 있음)" title="쪽지함" style="position:relative;width:44px;height:44px;border-radius:9999px;display:flex;align-items:center;justify-content:center;color:#2A2A2A;text-decoration:none" style-hover="background:#F4F6F9;color:#1C59FE">
            <x-import component-from-global-scope="Sangsang.Icon" name="bell" size="{{ 24 }}" hint-size="24px,24px"></x-import>
            <span aria-hidden="true" style="position:absolute;top:10px;right:11px;width:8px;height:8px;border-radius:9999px;background:#E5484D;box-shadow:0 0 0 2px #FFFFFF"></span>
          </a>
          <span style="display:flex;flex-direction:column;white-space:nowrap;padding:0 4px">
            <span style="font-size:14px;line-height:20px;font-weight:600;color:#2A2A2A">{{ userName }} 님</span>
            <span style="font-size:12px;line-height:18px;color:#666E7A">{{ userOrg }}</span>
          </span>
        </div>
        <span aria-hidden="true" style="width:1px;height:16px;background:#E3E7ED"></span>
        <x-import component-from-global-scope="Sangsang.Button" variant="ghost" size="sm" onClick="{{ askLogout }}" hint-size="72px,32px">로그아웃</x-import>
      </sc-if>
      <sc-if value="{{ loggedOut }}" hint-placeholder-val="{{ false }}">
        <x-import component-from-global-scope="Sangsang.Button" variant="primary" size="sm" onClick="{{ login }}" hint-size="72px,32px">로그인</x-import>
      </sc-if>
    </div>
  </div>

  <sc-if value="{{ confirmOpen }}" hint-placeholder-val="{{ false }}">
    <div onClick="{{ cancelLogout }}" style="position:fixed;inset:0;background:rgba(13,20,33,0.48);display:flex;align-items:center;justify-content:center;padding:16px;z-index:200">
      <div role="dialog" aria-modal="true" aria-labelledby="gnb-logout-title" onClick="{{ stop }}" style="width:100%;max-width:400px;background:#FFFFFF;border-radius:16px;box-shadow:0 16px 40px rgba(16,24,40,0.18);display:flex;flex-direction:column">
        <div style="padding:20px 24px 0;display:flex;align-items:center;justify-content:space-between;gap:12px">
          <h2 id="gnb-logout-title" style="margin:0;font-size:18px;line-height:27px;font-weight:700">로그아웃할까요?</h2>
          <x-import component-from-global-scope="Sangsang.IconButton" icon="x" label="닫기" onClick="{{ cancelLogout }}" hint-size="40px,40px"></x-import>
        </div>
        <p style="margin:0;padding:12px 24px 24px;font-size:14px;line-height:22px;color:#4A5260">보던 강의는 지금 위치까지 저장돼요. 다시 들어오면 이어서 볼 수 있어요.</p>
        <div style="display:flex;justify-content:flex-end;gap:8px;padding:16px 24px;border-top:1px solid #E3E7ED">
          <x-import component-from-global-scope="Sangsang.Button" variant="outline" onClick="{{ cancelLogout }}" hint-size="64px,40px">취소</x-import>
          <x-import component-from-global-scope="Sangsang.Button" variant="primary" onClick="{{ doLogout }}" hint-size="88px,40px">로그아웃</x-import>
        </div>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ toastOpen }}" hint-placeholder-val="{{ false }}">
    <div role="status" style="position:fixed;left:50%;bottom:32px;transform:translateX(-50%);z-index:210">
      <x-import component-from-global-scope="Sangsang.Toast" tone="{{ toastTone }}" hint-size="200px,48px">{{ toastMsg }}</x-import>
    </div>
  </sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;1440px&quot;,&quot;height&quot;:&quot;360px&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;없음&quot;,&quot;연수원 소개&quot;,&quot;교육 과정&quot;,&quot;공동학습&quot;,&quot;지원센터&quot;,&quot;나의 학습&quot;],&quot;default&quot;:&quot;없음&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;userName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;김미코&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;userOrg&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;반도체사업부 · 책임&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { hover: null, mega: false, confirm: false, loggedOut: false, toast: false };
  get menus() { const v2 = (this.props.aboutVersion ?? 'new') !== 'old'; return [
    v2 ? { label: '연수원 안내', href: '연수원 소개.dc.html', subs: ['미코 Way', '연수원 소개', '시설 안내', '이용 안내', '오시는 길'], hrefs: ['연수원 소개.dc.html#way', '연수원 소개.dc.html#greeting', '연수원 소개.dc.html#facility', '연수원 소개.dc.html#guide', '연수원 소개.dc.html#map'] }
       : { label: '연수원 소개', href: '연수원 소개.dc.html', subs: ['미코 WAY · 인재상', '인사말 · 연수원 소개'], hrefs: ['연수원 소개.dc.html#way', '연수원 소개.dc.html#greeting'] },
    { label: '교육 과정', href: '교육 과정.dc.html', subs: ['전체 과정', '필수 교육', '선택 교육'] },
    { label: '공동학습', href: '#', subs: ['Open Lab', '학습 동아리', '멘토링', '커뮤니티', '성과 공유'], soon: true, soonSubs: [0, 1, 2, 3, 4] },
    { label: '지원센터', href: '지원센터.dc.html', subs: ['FAQ', '공지사항', '1:1 문의', '자료실'], hrefs: ['지원센터.dc.html#faq', '지원센터.dc.html#notice', '지원센터.dc.html#qna', '지원센터.dc.html#archive'] },
    { label: '나의 학습', href: '나의 학습.dc.html', subs: ['학습 관리', '학습 기록', '역량 분석'], hrefs: ['나의 학습.dc.html#classroom', '나의 학습.dc.html#history', '#'], soonSubs: [2] }
  ]; }
  componentDidMount() {
    this.lastY = window.scrollY;
    document.documentElement.style.setProperty('--gnb-offset', '73px');
    this.onScroll = () => {
      const y = window.scrollY, d = y - this.lastY;
      if (Math.abs(d) < 6) return;
      const hide = y > 80 && d > 0 && !this.state.mega;
      if (hide !== !!this.state.gnbHidden) { document.documentElement.style.setProperty('--gnb-offset', hide ? '0px' : '73px'); this.setState({ gnbHidden: hide }); }
      this.lastY = y;
    };
    window.addEventListener('scroll', this.onScroll, { passive: true });
  }
  componentWillUnmount() { clearTimeout(this.t); window.removeEventListener('scroll', this.onScroll); }
  showToast(msg, tone) {
    this.setState({ toast: msg, toastTone: tone || 'success' });
    clearTimeout(this.t);
    this.t = setTimeout(() => this.setState({ toast: false }), 3000);
  }
  renderVals() {
    const gnbTop = this.state.gnbHidden ? '-80px' : '0px';
    const active = this.props.active ?? '없음';
    const { hover, mega } = this.state;
    return {
      gnbTop,
      menus: this.menus.map((m, i) => {
        const on = m.label === active || (i === 0 && (active === '연수원 소개' || active === '연수원 안내')) || (mega && hover === i);
        return {
          label: m.label, href: m.href, on, off: !on,
          showHot: mega && hover === i,
          showCold: mega && hover !== i,
          onEnter: () => this.setState({ hover: i, mega: true }),
          onClick: e => { if (m.soon) { e.preventDefault(); this.showToast('아직 준비중입니다.', 'info'); } },
          subs: m.subs.map((s, j) => { const soon = !!(m.soonSubs && m.soonSubs.includes(j)); return { label: s, href: m.hrefs ? m.hrefs[j] : m.href, soon, live: !soon,
            onClick: e => { if (soon) { e.preventDefault(); this.setState({ mega: false, hover: null }); this.showToast('아직 준비중입니다.', 'info'); } } }; })
        };
      }),
      megaOpen: mega,
      ...(() => { const n = Math.max(...this.menus.map(m => m.subs.length)); const h = 20 + n * 36 + (n - 1) * 2 + 32; return { colH: h + 'px', megaH: (h + 2) + 'px' }; })(),
      hoverLabel: hover != null ? this.menus[hover].label : '',
      closeMega: () => this.setState({ mega: false, hover: null }),
      userName: this.props.userName ?? '김미코',
      userOrg: this.props.userOrg ?? '반도체사업부 · 책임',
      loggedIn: !this.state.loggedOut,
      loggedOut: this.state.loggedOut,
      askLogout: () => this.setState({ confirm: true, mega: false }),
      cancelLogout: () => this.setState({ confirm: false }),
      doLogout: () => {
        this.setState({ confirm: false, loggedOut: true });
        this.showToast('로그아웃했어요');
      },
      login: () => this.setState({ loggedOut: false }),
      confirmOpen: this.state.confirm,
      toastOpen: !!this.state.toast, toastMsg: this.state.toast || '', toastTone: this.state.toastTone || 'success',
      stop: e => e.stopPropagation()
    };
  }
}
</script>
</body>
</html>
